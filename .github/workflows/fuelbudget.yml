name: Fuelbudget Sync

on:
  schedule:
    - cron: "0 */3 * * *"   # tiap 3 jam
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python Merpis_FuelConsumption/fuelbudget_pipeline.py
        env:
          MERPIS_TOKEN: ${{ secrets.MERPIS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}